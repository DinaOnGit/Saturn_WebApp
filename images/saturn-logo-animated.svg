<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <title>Saturn</title>
  <!--
    Saturn logo with motion: a soft white light travels slowly round each ring
    (9 s, 7 s and 5.5 s per lap), so the planet feels alive on the welcome screen.
    The animation lives inside this file, so it also works in a normal <img>.
    People who turn on "Reduce motion" see the still logo.
  -->
  <style>
    .glint {
      stroke: #FFFFFF;
      opacity: .85;
      stroke-dasharray: 11 89;               /* a short light, then a long gap */
      animation: travel linear infinite;
    }
    .g1 { animation-duration: 9s; }
    .g2 { animation-duration: 7s;   animation-delay: -2s; }
    .g3 { animation-duration: 5.5s; animation-delay: -4s; }
    @keyframes travel {
      from { stroke-dashoffset: 100; }
      to   { stroke-dashoffset: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .glint { animation: none; opacity: 0; }
    }
  </style>
  <defs>
    <!-- the front half of the rings, so they pass in front of the planet -->
    <clipPath id="front"><rect x="-4" y="20" width="48" height="24"/></clipPath>
    <g id="rings" fill="none" stroke-width="2.4" stroke-linecap="round">
      <ellipse cx="20" cy="20" rx="18" ry="6.2" stroke="#74CF96"/>
      <ellipse cx="20" cy="20" rx="15" ry="5"   stroke="#B79CFF"/>
      <ellipse cx="20" cy="20" rx="12" ry="3.8" stroke="#F6A672"/>
      <ellipse class="glint g1" cx="20" cy="20" rx="18" ry="6.2" pathLength="100"/>
      <ellipse class="glint g2" cx="20" cy="20" rx="15" ry="5"   pathLength="100"/>
      <ellipse class="glint g3" cx="20" cy="20" rx="12" ry="3.8" pathLength="100"/>
    </g>
  </defs>

  <!-- back of the rings, the planet, then the front of the rings -->
  <use href="#rings" transform="rotate(-18 20 20)"/>
  <circle cx="20" cy="20" r="8.4" fill="#E9EDF2"/>
  <g transform="rotate(-18 20 20)" clip-path="url(#front)">
    <use href="#rings"/>
  </g>
</svg>
