<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="84" height="84"><title>Loading</title><style>.arc{animation:orbit linear infinite}@keyframes orbit{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.arc{animation:none}}</style><defs><clipPath id="front"><rect x="-4" y="20" width="48" height="24"/></clipPath></defs><g id="rings" transform="rotate(-18 20 20)" fill="none" stroke-width="2.6" stroke-linecap="round"><ellipse cx="20" cy="20" rx="18" ry="6.2" stroke="#74CF96" opacity=".28"/><ellipse class="arc" cx="20" cy="20" rx="18" ry="6.2" stroke="#74CF96" pathLength="100" stroke-dasharray="30 70" style="animation-duration:2.2s"/><ellipse cx="20" cy="20" rx="15" ry="5" stroke="#B79CFF" opacity=".28"/><ellipse class="arc" cx="20" cy="20" rx="15" ry="5" stroke="#B79CFF" pathLength="100" stroke-dasharray="30 70" style="animation-duration:1.7s"/><ellipse cx="20" cy="20" rx="12" ry="3.8" stroke="#F6A672" opacity=".28"/><ellipse class="arc" cx="20" cy="20" rx="12" ry="3.8" stroke="#F6A672" pathLength="100" stroke-dasharray="30 70" style="animation-duration:1.3s"/></g><circle cx="20" cy="20" r="8.4" fill="#E9EDF2"/><use href="#rings" clip-path="url(#front)"/></svg>
