    <header id="topnav">
      <div class="navbar">
        <!-- Left Logo and Title -->
        <div class="logo">
          <img
            src="images/saturn-logo.svg"
            width="44"
            height="44"
            alt="Saturn logo"
          />
          <span>Saturn</span>
        </div>

        <!-- Right Search,Status, and Account -->
        <div class="right">
          <!-- Search Icon (visible at start) -->
          <button id="searchButton" class="search-button" type="button">
            🔍
          </button>

          <!-- Search Bar (hidden until search icon is clicked) -->
          <div id="searchBox" class="search-box hidden">
            <span>🔍</span>
            <input
              id="searchInput"
              type="text"
              placeholder="Search posts or #tags"
            />
            <button id="searchClose" class="close-button" type="button">
              ✕
            </button>
          </div>

          <!-- Status -->
          <div class="status">
            <span class="dot"></span>
            <span>Feed online</span>
          </div>

          <!-- Account Button and Dropdown -->
          <div class="account">
            <button id="accountButton" class="account-button" type="button">
              <img
                src="images/sample-avatar-jane.jpg"
                class="avatar"
                alt="Jane Bond"
              />
              <span>Jane Bond ▾</span>
            </button>

            <div id="dropdown" class="dropdown hidden">
              <img
                src="images/sample-avatar-jane.jpg"
                class="avatar-big"
                alt="Jane Bond"
              />
              <h3>Jane Bond</h3>
              <p>@jane-bond</p>
              <button
                id="disconnectButton"
                class="disconnect-button"
                type="button"
              >
                Disconnect GitHub
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>
